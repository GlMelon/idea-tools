# Gradle配置
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true

# 日志配置 - 控制台颜色输出
# 只有ERROR级别显示为红色，WARN级别使用默认颜色
org.gradle.logging.level=lifecycle
org.gradle.console=rich

# 自定义日志控制
# showErrorsOnly=true 只显示错误信息
# quiet=true 静默模式

# 插件基本信息
pluginGroup=io.github.easy.tools
pluginName=Easy Tools
pluginVersion=1.0.1

# IntelliJ Platform Gradle Plugin配置
# 使用2.x版本的新插件（更新到最新版本以支持本地 IDE）
gradle.intellij.plugin.version=2.10.5

# IntelliJ平台版本 (支持2020-2025所有版本)
# 可选值: IC (IntelliJ IDEA Community), IU (Ultimate)
platformType=IU
# 使用2025.3版本作为开发基准版本(兼容Java 21)
platformVersion=2026.1

# 版本兼容性配置
# 兼容范围: 2024.1(241) 及以上所有版本 —— 不设 untilBuild 上限,
#   避免 IDEA 每次升级后提示"需要IDE内部版本XXX.*或更低版本"导致插件不可用。
# 测试版本:
#   - 2024.3.2 (243) Java 21
#   - 2025.2.5 (252) Java 21
#   - 2025.3 (253) Java 21
#   - 2026.1 (261) Java 21
#   - 2026.2 (262) Java 21
platformSinceBuild=241
# untilBuild 已废弃: build.gradle 中 untilBuild=provider{null}, 兼容所有未来版本。
# 如需重新启用上限, 取消下行注释, 并在 build.gradle 中恢复:
#   untilBuild = providers.gradleProperty('platformUntilBuild')
# platformUntilBuild=263.*

# Java版本配置
# IntelliJ Platform 2026.1 全部用 Java 21 构建(class version 65), 必须用 JDK 21 编译。
javaVersion=21

# 显式指定本机 JDK 21 路径, 让 Gradle toolchain 识别(它不在自动检测路径下)。
# 平台 2026.1 的 jar 是 Java 21 编译的, 用 JDK 17 的 javac 会报 "class file version 65.0, should be 61.0"。
# 如更换 JDK 位置, 同步修改下行。
org.gradle.java.installations.paths=D:/tools/jdk21

# 第三方依赖版本
hutool.version=5.8.24
lombok.version=1.18.36
junit4.version=4.13.2
junit5.version=5.9.1

# IntelliJ Platform Gradle Plugin 下载配置
# Cache Redirector 会把请求重定向到 CloudFront(国内访问常 Connection reset),故禁用,
# 改为直连 jetbrains.com/intellij-repository(国内可达性更稳定)。
org.jetbrains.intellij.platform.useCacheRedirector=false

# IDE安装包缓存目录（多项目共享缓存）
# 可设置为自定义路径以在多个项目间共享下载的IDE
# org.jetbrains.intellij.platform.intellijPlatformIdesCache=/path/to/shared/cache

# 下载源代码（开发时查看源码方便）
org.jetbrains.intellij.platform.downloadSources=true

# MyBatis 功能验证 Fixture 依赖版本
mybatis.version=3.5.16
mybatis-plus.version=3.5.7
